<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <!-- soft ground shadow -->
  <ellipse cx="240" cy="308" rx="150" ry="16" fill="#1F3B57" fill-opacity="0.05"/>
  <!-- floating sheets -->
  <g stroke="#8494A7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="118" y="70" width="64" height="80" rx="6" fill="#FFFFFF" transform="rotate(-9 150 110)"/>
    <path d="M132 96 h40 M130 112 h44 M129 128 h36" transform="rotate(-9 150 110)"/>
    <rect x="296" y="56" width="64" height="80" rx="6" fill="#FFFFFF" transform="rotate(8 328 96)"/>
    <path d="M308 84 h40 M310 100 h44 M312 116 h36" transform="rotate(8 328 96)"/>
  </g>
  <!-- gold folded corner accent on sheets -->
  <path d="M170 66 l12 12 -16 2 z" fill="#C9A227" fill-opacity="0.5" transform="rotate(-9 150 110)"/>
  <path d="M304 62 l14 10 -16 4 z" fill="#C9A227" fill-opacity="0.5" transform="rotate(8 328 96)"/>
  <!-- open crate -->
  <g stroke="#2A4A6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- back interior -->
    <path d="M150 172 L330 172 L312 206 L168 206 Z" fill="#EEF1F5"/>
    <!-- crate body -->
    <path d="M146 206 L334 206 L318 292 L162 292 Z" fill="#FFFFFF"/>
    <!-- crate slats -->
    <path d="M156 230 L324 230 M160 254 L320 254 M163 278 L317 278" stroke="#B9C4D1"/>
    <!-- open flaps -->
    <path d="M150 172 L104 142 L122 132 L168 160 Z" fill="#FFFFFF"/>
    <path d="M330 172 L376 142 L358 132 L312 160 Z" fill="#FFFFFF"/>
  </g>
  <!-- gold accent line inside crate -->
  <path d="M180 218 h120" stroke="#C9A227" stroke-width="4" stroke-linecap="round" stroke-opacity="0.7"/>
  <!-- magnifier -->
  <g stroke="#2A4A6B" stroke-width="5" stroke-linecap="round">
    <circle cx="350" cy="238" r="30" fill="#FFFFFF"/>
    <circle cx="350" cy="238" r="30" stroke="#C9A227" stroke-opacity="0.35"/>
    <path d="M372 260 L398 286"/>
  </g>
  <!-- tiny sparkles -->
  <g stroke="#C9A227" stroke-width="3" stroke-linecap="round">
    <path d="M96 96 v14 M89 103 h14"/>
    <path d="M398 96 v12 M392 102 h12"/>
  </g>
</svg>
