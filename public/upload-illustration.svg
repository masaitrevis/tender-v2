<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400" fill="none">
  <ellipse cx="280" cy="360" rx="200" ry="14" fill="#1F3B57" fill-opacity="0.05"/>
  <!-- Excel spreadsheet grid -->
  <g stroke="#2A4A6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="52" y="88" width="176" height="220" rx="10" fill="#FFFFFF"/>
    <!-- header band (green like Excel) -->
    <rect x="52" y="88" width="176" height="30" rx="10" fill="#16A34A" fill-opacity="0.14" stroke="none"/>
    <path d="M52 128 a10 10 0 0 1 0 -10" fill="none"/>
  </g>
  <g stroke="#8494A7" stroke-width="2.5" stroke-linecap="round">
    <path d="M52 118 h176"/>
    <path d="M96 118 v190 M140 118 v190 M184 118 v190"/>
    <path d="M52 156 h176 M52 194 h176 M52 232 h176 M52 270 h176"/>
  </g>
  <!-- header letters -->
  <g fill="#8494A7" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">
    <text x="74" y="108">A</text><text x="118" y="108">B</text><text x="162" y="108">C</text><text x="206" y="108">D</text>
  </g>
  <!-- green check dots on rows -->
  <g fill="#16A34A">
    <circle cx="74" cy="175" r="5"/><circle cx="74" cy="213" r="5"/><circle cx="74" cy="251" r="5"/><circle cx="74" cy="289" r="5"/>
  </g>
  <g stroke="#B9C4D1" stroke-width="3" stroke-linecap="round">
    <path d="M104 175 h72 M104 213 h72 M104 251 h72 M104 289 h72"/>
  </g>
  <!-- gold arrow -->
  <g>
    <path d="M256 198 h84" stroke="#C9A227" stroke-width="8" stroke-linecap="round"/>
    <path d="M332 176 l28 22 -28 22 z" fill="#C9A227"/>
    <path d="M262 226 h60" stroke="#C9A227" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/>
  </g>
  <!-- stacked database rows -->
  <g stroke="#2A4A6B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <rect x="396" y="96" width="120" height="44" rx="10" fill="#FFFFFF"/>
      <rect x="396" y="152" width="120" height="44" rx="10" fill="#FFFFFF"/>
      <rect x="396" y="208" width="120" height="44" rx="10" fill="#FFFFFF"/>
      <rect x="396" y="264" width="120" height="44" rx="10" fill="#FFFFFF"/>
    </g>
  </g>
  <g stroke="#B9C4D1" stroke-width="3" stroke-linecap="round">
    <path d="M436 118 h64 M436 174 h64 M436 230 h64 M436 286 h64"/>
  </g>
  <!-- green checks on db rows -->
  <g stroke="#16A34A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M410 118 l5 5 9 -10"/>
    <path d="M410 174 l5 5 9 -10"/>
    <path d="M410 230 l5 5 9 -10"/>
    <path d="M410 286 l5 5 9 -10"/>
  </g>
  <!-- sparkles -->
  <g stroke="#C9A227" stroke-width="3" stroke-linecap="round">
    <path d="M270 96 v14 M263 103 h14"/>
    <path d="M470 60 v12 M464 66 h12"/>
  </g>
</svg>
